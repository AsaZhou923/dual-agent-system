name: System integration CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Parse JSON
        run: |
          python -m json.tool compatibility.json >/dev/null
          python -m json.tool dependencies.lock.json >/dev/null
          python -m json.tool contracts/mac-job-v1-system.schema.json >/dev/null
          for fixture in fixtures/mac-job-v1*.json; do
            python -m json.tool "$fixture" >/dev/null
          done
      - name: Verify pinned metadata
        run: python scripts/verify_system.py --metadata-only
      - name: Verify initialized components and wire contract
        run: python scripts/verify_system.py
      - name: Test system helpers
        run: python -m unittest discover -s tests -v
      - name: Test Windows Lead component
        env:
          PYTHONPATH: components/windows-lead
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s components/windows-lead/tests -v
